const $=id=>sh.getElementById(id);

function calc(){
  const bal={...st.stock},tot={},out=[];
  S.forEach(([name,items],idx)=>{
    const key="s"+idx;const skip=!!st.done[key];
    const rows=items.map(([m,need])=>{
      if(skip)return{m,need,avail:0,short:0,skip:true};
      const avail=Math.max(0,bal[m]),short=Math.max(0,need-avail);
      bal[m]-=need;tot[m]=(tot[m]||0)+need;
      return{m,need,avail,short};
    });
    out.push({name,key,rows,skip});
  });
  return{out,tot};
}

function render(){
  const{out,tot}=calc();
  // steps
  let chg=false;
  $("steps").innerHTML=out.map((s,i)=>{
    const lack=s.rows.filter(r=>r.short>0).length;
    const ok=s.skip||lack===0;if(st.ok[s.key]!==ok){st.ok[s.key]=ok;delete st.fold[s.key];chg=true}
    const col=st.fold[s.key]!==undefined?st.fold[s.key]:ok;
    const badge=s.skip?`<span class="badge ok">${t("done")}</span>`:lack?`<span class="badge">${lack} ${t("lack")}</span>`:`<span class="badge ok">${t("clear")}</span>`;
    const body=s.rows.map(r=>`<tr><td>${r.m}</td><td>${fmt(r.need)}</td><td>${s.skip?"\u2013":fmt(r.avail)}</td><td>${s.skip?"\u2013":r.short>0?`<span class="short">${fmt(r.short)}</span>`:`<span class="clear">${t("clear")}</span>`}</td></tr>`).join("");
    return`<div class="card step ${s.skip?"done":""} ${col?"collapsed":""}" style="--c:${GC[grp(s.name)]}"><header data-fold="${s.key}" role="button" tabindex="0" aria-expanded="${!col}"><span class="chev">\u25be</span><h3>${s.name}</h3>${badge}<label class="chk"><input type="checkbox" data-step="${s.key}" ${s.skip?"checked":""}> ${t("chk")}</label></header><div class="wrap"><table><thead><tr><th>${t("material")}</th><th>${t("need")}</th><th>${t("avail")}</th><th>${t("shortage")}</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join("");
  if(chg)save();
  // summary
  const lacks=Object.keys(tot).map(m=>({m,need:tot[m],have:st.stock[m],short:Math.max(0,tot[m]-st.stock[m])})).filter(x=>x.short>0).sort((a,b)=>a.m.localeCompare(b.m));
  $("summary").innerHTML=lacks.length?`<table><thead><tr><th>${t("material")}</th><th>${t("totalNeed")}</th><th>${t("stock")}</th><th>${t("toFind")}</th></tr></thead><tbody>${lacks.map(x=>`<tr><td>${nm(x.m)}</td><td>${fmt(x.need)}</td><td>${fmt(x.have)}</td><td><span class="short">${fmt(x.short)}</span></td></tr>`).join("")}</tbody></table>`:`<div class="empty">${t("allOk")}</div>`;
  // stats
  const active=out.filter(s=>!s.skip),clearN=out.filter(s=>s.skip||s.rows.every(r=>r.short===0)).length;
  const mats=Object.keys(tot),ratio=mats.reduce((a,m)=>a+Math.min(1,Math.max(0,st.stock[m])/tot[m]),0)/(mats.length||1);
  
  const pct=lacks.length?Math.min(99,Math.round(ratio*100)):100;
  $("sClear").textContent=clearN+"/"+out.length;
  $("sLack").textContent=lacks.length;
  $("sPct").textContent=pct+"%";
  $("pbar").style.width=pct+"%";
}

const ICO={"NWQ":NWQI,"Eternity Sand":ESI,"Luster":LSI,"Veritas":VRI,"Verum Proof":VPI,"Astra":ASI,"Idean":IDI};
const nm=m=>ICO[m]?`<span class="nm"><img class="ico" alt="" src="${ICO[m]}">${m}</span>`:m;
const chips=a=>a.map(([m,n])=>`<label>${nm(m)}<b>${n}</b></label>`).join("");
function buildTotal(){$("total").innerHTML=chips(U);$("totalDom").innerHTML=chips(D)}
function buildStocks(){
  $("stocks").innerHTML=Object.keys(DEF).map(m=>`<label>${nm(m)}<input type="number" min="0" inputmode="numeric" data-m="${m}" value="${st.stock[m]}"></label>`).join("");
}

$("stocks").addEventListener("input",e=>{
  const m=e.target.dataset.m;if(!m)return;
  st.stock[m]=Math.max(0,parseInt(e.target.value)||0);save();render();
});
$("steps").addEventListener("change",e=>{
  const s=e.target.dataset.step;if(!s)return;
  st.done[s]=e.target.checked;save();render();
});
const toggleFold=h=>{const c=h.parentElement.classList.contains("collapsed");st.fold[h.dataset.fold]=!c;save();render()};
$("steps").addEventListener("click",e=>{const h=e.target.closest("[data-fold]");if(!h||e.target.closest(".chk"))return;toggleFold(h)});
$("steps").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset.fold){e.preventDefault();toggleFold(e.target)}});
const applySum=()=>{$("summary").hidden=st.sumC;$("hLack").classList.toggle("c",st.sumC);$("hLack").setAttribute("aria-expanded",!st.sumC)};
const toggleSum=()=>{st.sumC=!st.sumC;save();applySum()};
$("hLack").addEventListener("click",toggleSum);
$("hLack").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleSum()}});
const TABS={hTotal:"total",hLack:"lack",hStock:"stock",hSteps:"steps"};
const setTab=g=>{host.setAttribute("data-tab",TABS[g]);sh.querySelectorAll("#qnav button").forEach(b=>b.classList.toggle("on",b.dataset.go===g))};
$("qnav").addEventListener("click",e=>{const g=e.target.dataset.go;if(!g)return;if(host.hasAttribute("data-short")){setTab(g);window.scrollTo(0,0)}else $(g).scrollIntoView({behavior:"smooth",block:"start"})});
const TK="evoker-flb-theme",LK="evoker-flb-lang",root=host;
const getL=k=>{if(window.__FLB__&&window.__FLB__[k])return window.__FLB__[k];try{return localStorage.getItem(k)}catch(e){return null}};
const setL=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function applyTheme(m){root.setAttribute("data-theme",m);sh.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th===m))}
function applyLang(l){lang=l;root.lang=l;
  sh.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  sh.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));
  $("gear").setAttribute("aria-label",t("settings"));render()}
const fitEmbed=()=>{host.toggleAttribute("data-embed",window.self!==window.top);host.toggleAttribute("data-short",Math.min(window.innerHeight,519)===window.innerHeight);if(host.hasAttribute("data-short")&&!host.hasAttribute("data-tab"))setTab("hLack")};fitEmbed();window.addEventListener("resize",fitEmbed);
applyTheme(getL(TK)||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
applyLang(getL(LK)||((navigator.language||"").toLowerCase().startsWith("id")?"id":"en"));
$("panel").addEventListener("click",e=>{
  const l=e.target.dataset.lang,m=e.target.dataset.th;
  if(l){setL(LK,l);applyLang(l)}
  if(m){setL(TK,m);applyTheme(m)}
});
const setOpen=o=>{$("panel").hidden=!o;$("gear").setAttribute("aria-expanded",o)};
$("gear").addEventListener("click",e=>{e.stopPropagation();setOpen($("panel").hidden)});
document.addEventListener("click",e=>{if(!e.composedPath().includes($("panel")))setOpen(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")setOpen(false)});
$("full").addEventListener("click",()=>{
let ok=false;
try{
const L="\u003c",pre={};
pre[KEY]=JSON.stringify(st);pre[TK]=root.getAttribute("data-theme");pre[LK]=lang;
const js=JSON.stringify(pre).split(L).join("\\u003c");
const bg=root.getAttribute("data-theme")==="dark"?"#17151c":"#f6f4ee";
const html=L+"!DOCTYPE html>"+L+"html lang=\""+lang+"\">"+L+"head>"+L+"meta charset=\"utf-8\">"+L+"meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">"+L+"title>Evoker FLB Tracker"+L+"/title>"+L+"style>html,body{margin:0;background:"+bg+"}"+L+"/style>"+L+"/head>"+L+"body>"+L+"div id=\"flbErr\" style=\"display:none\">"+L+"/div>"+L+"div id=\"flb-root\">"+L+"/div>"+L+"script>window.__FLB__="+js+";"+L+"/script>"+L+"script>"+SRC+L+"/script>"+L+"/body>"+L+"/html>";
const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
ok=!!window.open(url,"_blank");
}catch(e){}
if(!ok){const m=document.getElementById("flbErr");if(m){m.style.display="block";m.textContent=t("fullFail")}}
});
$("reset").addEventListener("click",()=>{
  if(!confirm(t("confirm")))return;
  st={stock:{...DEF},done:{},fold:{},ok:{},sumC:st.sumC};save();buildStocks();render();
});
buildTotal();buildStocks();render();applySum();
})();
</script>
</body>
</html>
