.set{position:relative;flex-shrink:0}

.row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;color:var(--mute)}

const $=id=>sh.getElementById(id);

const renameList=a=>{const mp=MN[st.el+"/"+(st.ch[st.el]||"")];return mp?a.map(([m,n])=>[mp[m]||m,n]):a};
function view(){return !st.el?"none":!CHARS[st.el]?"soon":!st.ch[st.el]?"chars":"calc"}
const stepsFor=el=>S.map(([name,items])=>[name,renameList(splitList(items,el))]);
const matsFor=el=>{const u={},o=[];stepsFor(el).forEach(([n,it])=>it.forEach(([m])=>{if(!u[m]){u[m]=1;o.push(m)}}));const mp=MN[el+"/"+(st.ch[el]||"")]||{},inv={},ks=Object.keys(DEF);Object.keys(mp).forEach(k=>{inv[mp[k]]=k});const ix=m=>{const i=ks.indexOf(inv[m]||m);return i>=0?i:999};return o.slice().sort((x,y)=>ix(x)-ix(y))};
function calc(){
  stepsFor(st.el).forEach(([n,it])=>it.forEach(([m])=>{if(st.stock[m]===undefined)st.stock[m]=0}));
  const bal={...st.stock},tot={},out=[];
  stepsFor(st.el).forEach(([name,items],idx)=>{
    const key=st.el+"_"+(st.ch[st.el]||"x")+"_s"+idx;const skip=!!st.done[key];
    const rows=items.map(([m,need])=>{
      if(skip)return{m,need,avail:0,short:0,skip:true};
      const avail=Math.max(0,bal[m]),short=Math.max(0,need-avail);
      bal[m]-=need;tot[m]=(tot[m]||0)+need;
      return{m,need,avail,short};
    });
    out.push({name,key,rows,skip});
  });
  return{out,tot};
}

function render(){
  applyView();
  const{out,tot}=calc();
  // steps
  let chg=false;
  $("steps").innerHTML=out.map((s,i)=>{
    const lack=s.rows.filter(r=>r.short>0).length;
    const ok=s.skip||lack===0;if(st.ok[s.key]!==ok){st.ok[s.key]=ok;chg=true}
    const col=st.fold[s.key]!==undefined?st.fold[s.key]:true;
    const badge=s.skip?`<span class="badge ok">${t("done")}</span>`:lack?`<span class="badge">${lack} ${t("lack")}</span>`:`<span class="badge ok">${t("clear")}</span>`;
    const body=s.rows.map(r=>`<tr><td>${tw(r.m)}</td><td>${fmt(r.need)}</td><td>${s.skip?"\u2013":fmt(r.avail)}</td><td>${s.skip?"\u2013":r.short>0?`<span class="short">${fmt(r.short)}</span>`:`<span class="clear">${t("clear")}</span>`}</td></tr>`).join("");
    return`<div class="card step ${s.skip?"done":""} ${col?"collapsed":""}" style="--c:${GC[grp(s.name)]}"><header data-fold="${s.key}" role="button" tabindex="0" aria-expanded="${!col}"><span class="chev">\u25be</span><h3>${s.name}</h3>${badge}<label class="chk"><input type="checkbox" data-step="${s.key}" ${s.skip?"checked":""}> ${t("chk")}</label></header><div class="wrap"><table><thead><tr><th>${t("material")}</th><th>${t("need")}</th><th>${t("avail")}</th><th>${t("shortage")}</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join("");
  if(chg)save();
  // summary
  const lacks=Object.keys(tot).map(m=>({m,need:tot[m],have:st.stock[m],short:Math.max(0,tot[m]-st.stock[m])})).filter(x=>x.short>0).sort((a,b)=>a.m.localeCompare(b.m));
  const remN=out.filter(s=>!s.skip).map(s=>s.name),anyDone=out.some(s=>s.skip);
  const remNote=anyDone?`<div class="remain">${remN.length?t("countFrom")+" "+remN.join(", "):t("allDoneAll")}</div>`:"";
