#stocks input[type=number]{width:100%;height:44px;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats b{font-size:16px}
.stats>div{font-size:11px}
.step>header{padding:10px 12px;gap:8px}
.step h3{flex:1 1 55%}
.chk{flex:1 1 100%;min-height:36px;font-size:13px}
table{font-size:13px}
th,td{padding:8px 5px}
td:first-child{white-space:normal}
.mascot{width:56px;height:56px}
#qnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
#qnav button{flex:1;height:44px;font-size:13px;border-radius:10px}
}
.tab{display:block}
:host([data-short]) .app{display:flex;flex-direction:column}
:host([data-short]) .tab{display:none}
:host([data-short][data-tab="total"]) .tab[data-t="total"],:host([data-short][data-tab="lack"]) .tab[data-t="lack"],:host([data-short][data-tab="stock"]) .tab[data-t="stock"],:host([data-short][data-tab="steps"]) .tab[data-t="steps"]{display:block}
:host([data-short]) #qnav{display:flex!important;order:-1;position:sticky;top:0;bottom:auto;left:auto;right:auto;z-index:20;background:var(--card);border-top:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:6px}
:host([data-short]) #qnav button{flex:1;height:36px;font-size:13px;border-radius:8px}
:host([data-short]) #qnav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:host([data-short]) main{padding:8px 10px 14px}
:host([data-short]) .ttl .sub,:host([data-short]) .mascot,:host([data-short]) .bar{display:none}
:host([data-short]) .logo{width:36px;height:36px}
:host([data-short]) h1{font-size:16px}
:host([data-short]) .top{margin-bottom:8px}
:host([data-short]) .prog{padding:8px 10px}
:host([data-short]) h2{margin:12px 0 6px}#full{display:none;margin-right:6px}:host([data-short][data-embed]) #full{display:inline-block}.els{display:flex;gap:6px;margin:0 0 12px}
.el{flex:1 1 0;min-width:0;padding:8px 4px;font-size:13px;border-radius:10px;border:1px solid var(--line);border-bottom:3px solid var(--ec);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.el.on{background:color-mix(in srgb,var(--ec) 22%,var(--card));border-color:var(--ec);box-shadow:0 0 0 2px var(--ec);font-weight:700}
.el{display:flex;flex-direction:column;align-items:center;gap:3px}
.eico{width:28px;height:28px;object-fit:contain}
.el-fire{--ec:#e0522b}.el-water{--ec:#2f7fd8}.el-earth{--ec:#a8742c}.el-wind{--ec:#2e9e5b}.el-dark{--ec:#7a4fd0}.el-light{--ec:#d9a400}
.elnote{font-size:12px;color:var(--mute);margin:-4px 0 12px}
.elnote[hidden]{display:none}
.box{padding:0}
.box>h2{margin:0!important;padding:12px 14px}
.box #totalBody{padding:0 14px 14px}
.subh{font-size:13px;color:var(--mute);margin:10px 0 8px}
.subh:first-child{margin-top:0}
.grid label b{flex-shrink:0;white-space:nowrap;margin-left:6px}
@media (max-width:600px){.el{font-size:12px;padding:6px 2px}.eico{width:24px;height:24px}}
:host([data-short]) .els{margin-bottom:8px}
:host([data-short]) .eico{width:18px;height:18px}
.hint{color:var(--mute);font-size:14px;text-align:center;padding:26px 8px}
.hint[hidden],.chars[hidden]{display:none}
.chars{display:flex;gap:10px;margin:0 0 12px}
.ch{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-size:14px}
.ch img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0}
.ch.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);font-weight:700}
.ico2{position:relative;display:inline-block;width:24px;height:24px;flex-shrink:0}
.ico2 .ico{position:absolute;left:0;top:0;transition:opacity .4s ease,transform .4s ease}
.ico2 .b{opacity:0;transform:scale(.75) rotate(-12deg)}
label:hover .ico2 .a,tr:hover .ico2 .a,.nm:hover .ico2 .a{opacity:0;transform:scale(.75) rotate(12deg)}
label:hover .ico2 .b,tr:hover .ico2 .b,.nm:hover .ico2 .b{opacity:1;transform:scale(1) rotate(0)}
.tip{border-bottom:1px dotted var(--mute);cursor:help}
.tipbox{position:fixed;z-index:60;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.tipbox[hidden]{display:none}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;line-height:1.5;color:var(--mute);text-align:center}
:host(:not([data-view="calc"])) .prog,:host(:not([data-view="calc"])) .tab,:host(:not([data-view="calc"])) #qnav{display:none!important}

const MN={"fire/alanaan":{"Verum Proof":"Fire Verum Proof","Idean":"Sun Idean","Astra":"Flameborne Astra","Luster":"Ignis Luster","Arcarum Fragment":"Aquila Fragment","M2 Omega Anima":"Shiva Omega Anima","Six Dragon Advent":"Smoldering Rubble","Haze":"Aurora Haze","Six-Dragon Jewel":"Wilnas's Jewel","Urn":"Fire Urn","Gospel":"Gospel of Egeiro"},"fire/fraux":{"Verum Proof":"Fire Verum Proof","Idean":"Devil Idean","Veritas":"Devil Veritas","Astra":"Flameborne Astra","Luster":"Ignis Luster","Arcarum Fragment":"Aquila Fragment","M2 Omega Anima":"Shiva Omega Anima","Six Dragon Advent":"Smoldering Rubble","Haze":"Aurora Haze","Six-Dragon Jewel":"Wilnas's Jewel","Urn":"Fire Urn","Gospel":"Gospel of Egeiro"}};
const TIPS={"Fire Verum Proof":"Replicard Sandbox - Zone Eletio: Slithering Seductress","Sun Idean":"Replicard Sandbox - Zone Eletio: Rageborn One","Devil Idean":"Replicard Sandbox - Zone Eletio: Blazing Everwing","Flameborne Astra":"Replicard Sandbox - Zone Eletio: Paradoxical Gate","Ignis Luster":"Replicard Sandbox: Eletion Glider, Athena Militis, Xeno Ifrit Militis, Prometheus Militis","Aquila Fragment":"Replicard Sandbox: Here Be Swords: All Defenders & Zone Bosses","Devil Veritas":"Replicard Sandbox - Every 5 node & Collect Sephira Treasure Chests","World Idean":"The World (Raid)"};
const renameList=a=>{const mp=MN[st.el+"/"+(st.ch[st.el]||"")];return mp?a.map(([m,n])=>[mp[m]||m,n]):a};
function view(){return !st.el?"none":!CHARS[st.el]?"soon":!st.ch[st.el]?"chars":"calc"}
const stepsFor=el=>S.map(([name,items])=>[name,renameList(splitList(items,el))]);
const matsFor=el=>{const u={},o=[];stepsFor(el).forEach(([n,it])=>it.forEach(([m])=>{if(!u[m]){u[m]=1;o.push(m)}}));const mp=MN[el+"/"+(st.ch[el]||"")]||{},inv={},ks=Object.keys(DEF);Object.keys(mp).forEach(k=>{inv[mp[k]]=k});const ix=m=>{const i=ks.indexOf(inv[m]||m);return i>=0?i:999};return o.slice().sort((x,y)=>ix(x)-ix(y))};
function calc(){
  stepsFor(st.el).forEach(([n,it])=>it.forEach(([m])=>{if(st.stock[m]===undefined)st.stock[m]=0}));
  const bal={...st.stock},tot={},out=[];
  stepsFor(st.el).forEach(([name,items],idx)=>{
    const key=st.el+"_"+(st.ch[st.el]||"x")+"_s"+idx;const skip=!!st.done[key];
    const rows=items.map(([m,need])=>{
      if(skip)return{m,need,avail:0,short:0,skip:true};
      const avail=Math.max(0,bal[m]),short=Math.max(0,need-avail);
      bal[m]-=need;tot[m]=(tot[m]||0)+need;
      return{m,need,avail,short};
    });
    out.push({name,key,rows,skip});
  });
  return{out,tot};
}

function render(){
  applyView();
  const{out,tot}=calc();
  // steps
  let chg=false;
  $("steps").innerHTML=out.map((s,i)=>{
    const lack=s.rows.filter(r=>r.short>0).length;
    const ok=s.skip||lack===0;if(st.ok[s.key]!==ok){st.ok[s.key]=ok;delete st.fold[s.key];chg=true}
    const col=st.fold[s.key]!==undefined?st.fold[s.key]:ok;
    const badge=s.skip?`<span class="badge ok">${t("done")}</span>`:lack?`<span class="badge">${lack} ${t("lack")}</span>`:`<span class="badge ok">${t("clear")}</span>`;
    const body=s.rows.map(r=>`<tr><td>${tw(r.m)}</td><td>${fmt(r.need)}</td><td>${s.skip?"\u2013":fmt(r.avail)}</td><td>${s.skip?"\u2013":r.short>0?`<span class="short">${fmt(r.short)}</span>`:`<span class="clear">${t("clear")}</span>`}</td></tr>`).join("");
    return`<div class="card step ${s.skip?"done":""} ${col?"collapsed":""}" style="--c:${GC[grp(s.name)]}"><header data-fold="${s.key}" role="button" tabindex="0" aria-expanded="${!col}"><span class="chev">\u25be</span><h3>${s.name}</h3>${badge}<label class="chk"><input type="checkbox" data-step="${s.key}" ${s.skip?"checked":""}> ${t("chk")}</label></header><div class="wrap"><table><thead><tr><th>${t("material")}</th><th>${t("need")}</th><th>${t("avail")}</th><th>${t("shortage")}</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join("");
  if(chg)save();
  // summary
  const lacks=Object.keys(tot).map(m=>({m,need:tot[m],have:st.stock[m],short:Math.max(0,tot[m]-st.stock[m])})).filter(x=>x.short>0).sort((a,b)=>a.m.localeCompare(b.m));
  $("summary").innerHTML=lacks.length?`<table><thead><tr><th>${t("material")}</th><th>${t("totalNeed")}</th><th>${t("stock")}</th><th>${t("toFind")}</th></tr></thead><tbody>${lacks.map(x=>`<tr><td>${nm(x.m)}</td><td>${fmt(x.need)}</td><td>${fmt(x.have)}</td><td><span class="short">${fmt(x.short)}</span></td></tr>`).join("")}</tbody></table>`:`<div class="empty">${t("allOk")}</div>`;
  // stats
  const active=out.filter(s=>!s.skip),clearN=out.filter(s=>s.skip||s.rows.every(r=>r.short===0)).length;
  const mats=Object.keys(tot),ratio=mats.reduce((a,m)=>a+Math.min(1,Math.max(0,st.stock[m])/tot[m]),0)/(mats.length||1);
  
  const pct=lacks.length?Math.min(99,Math.round(ratio*100)):100;

const ICO2={"Sunlight Stone / Radiant Prajnite":SS2};
const ICO={"Sunlight Stone / Radiant Prajnite":SS1,"World Idean":WIM,"Damascus Crystal":DCM,"Rupie":RPM,"Gospel of Egeiro":GEM,"Evolite":EVM,"Fire Urn":FUM,"Wilnas's Jewel":WJM,"Aurora Haze":AHM,"Smoldering Rubble":SRM,"Shiva Omega Anima":SOM,"Sephira Stone":SSM,"Genesis Fragment":GFM,"Devil Veritas":DVM,"Verdant Azurite":VAM,"Malice Fragment":MFM,"Aquila Fragment":AQM,"Ignis Luster":ILM,"Flameborne Astra":FAM,"Devil Idean":DIM,"Sun Idean":SIM,"Fire Verum Proof":FVP,"NWQ":NWQI,"Eternity Sand":ESI,"Luster":LSI,"Veritas":VRI,"Verum Proof":VPI,"Astra":ASI,"Idean":IDI};
const tw=m=>TIPS[m]?`<span class="tip" tabindex="0" data-tip="${TIPS[m]}">${m}</span>`:m;
const nm=m=>ICO[m]?`<span class="nm">${ICO2[m]?`<span class="ico2"><img class="ico a" alt="" src="${ICO[m]}"><img class="ico b" alt="" src="${ICO2[m]}"></span>`:`<img class="ico" alt="" src="${ICO[m]}">`}${tw(m)}</span>`:tw(m);
const chips=a=>a.map(([m,n])=>`<label>${nm(m)}<b>${n}</b></label>`).join("");
function buildTotal(){$("total").innerHTML=chips(renameList(splitList(U,st.el)));$("totalDom").innerHTML=chips(renameList(splitList(D,st.el)))}
function buildStocks(){
  $("stocks").innerHTML=matsFor(st.el).map(m=>`<label>${nm(m)}<input type="number" min="0" inputmode="numeric" data-m="${m}" value="${st.stock[m]}"></label>`).join("");
}

$("stocks").addEventListener("input",e=>{
  const m=e.target.dataset.m;if(!m)return;
  st.stock[m]=Math.max(0,parseInt(e.target.value)||0);save();render();
});
$("steps").addEventListener("change",e=>{
  const s=e.target.dataset.step;if(!s)return;
  st.done[s]=e.target.checked;save();render();
});

$("els").innerHTML=ELS.map(e=>`<button type="button" class="el el-${e}" data-el="${e}"><img class="eico" alt="" src="${EIC[e]}"><span>${ELN[e]}</span></button>`).join("");
const applyEl=()=>{sh.querySelectorAll("[data-el]").forEach(b=>b.classList.toggle("on",b.dataset.el===st.el));$("elNote").hidden=!(SPL[st.el]&&view()==="calc")};
$("els").addEventListener("click",e=>{const b=e.target.closest("[data-el]"),v=b&&b.dataset.el;if(!v||v===st.el)return;st.el=v;st.sel=true;save();applyEl();buildChars();applyView();buildTotal();buildStocks();render()});
const applyTot=()=>{$("totalBody").hidden=st.totC;$("hTotal").classList.toggle("c",st.totC);$("hTotal").setAttribute("aria-expanded",!st.totC)};
const toggleTot=()=>{st.totC=!st.totC;save();applyTot()};
$("hTotal").addEventListener("click",toggleTot);
$("hTotal").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleTot()}});
const showTip=el=>{const tb=$("tipbox");tb.textContent=t("farmTip")+" "+el.dataset.tip;tb.hidden=false;const r=el.getBoundingClientRect(),w=tb.offsetWidth,h=tb.offsetHeight;const x=Math.min(Math.max(8,r.left),Math.max(8,window.innerWidth-w-8));let y=r.top-h-8;if(8>y)y=r.bottom+8;tb.style.left=x+"px";tb.style.top=y+"px"};
const hideTip=()=>{$("tipbox").hidden=true};
const tipOf=e=>e.target.closest?e.target.closest("[data-tip]"):null;
sh.addEventListener("pointerover",e=>{if(e.pointerType!=="mouse")return;const el=tipOf(e);if(el)showTip(el)});
sh.addEventListener("pointerout",e=>{if(e.pointerType!=="mouse")return;if(tipOf(e))hideTip()});
sh.addEventListener("focusin",e=>{const el=tipOf(e);if(el)showTip(el)});
sh.addEventListener("focusout",e=>{if(!tipOf(e))return;const lab=e.target.closest("label");if(lab&&lab.contains(e.relatedTarget))return;hideTip()});
sh.addEventListener("click",e=>{const el=tipOf(e);if(el){showTip(el);return}const lab=e.target.closest?e.target.closest("label"):null;if(lab&&lab.querySelector("[data-tip]"))return;hideTip()});
window.addEventListener("scroll",hideTip,true);
function buildChars(){const L=CHARS[st.el];$("chars").hidden=!L;$("chars").innerHTML=L?L.map(c=>`<button type="button" class="ch${st.ch[st.el]===c.id?" on":""}" data-ch="${c.id}"><img alt="" src="${c.img}"><span>${c.n}</span></button>`).join(""):""}
function applyView(){const v=view();host.setAttribute("data-view",v);const h=$("hint");h.hidden=v==="calc";h.textContent=v==="none"?t("pickEl"):v==="soon"?t("soon"):v==="chars"?t("pickChar"):"";$("chars").hidden=!CHARS[st.el];$("elNote").hidden=!(SPL[st.el]&&v==="calc")}
$("chars").addEventListener("click",e=>{const b=e.target.closest("[data-ch]");if(!b)return;st.ch[st.el]=b.dataset.ch;save();buildChars();applyView();buildTotal();buildStocks();render()});
buildTotal();buildStocks();buildChars();render();applySum();applyEl();applyTot();
})();
</script>
